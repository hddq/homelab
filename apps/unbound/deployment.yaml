apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: unbound
  name: unbound
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unbound
  template:
    metadata:
      labels:
        app: unbound
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: madnuttah/unbound:1.25.1-1@sha256:b6ee69f236f04332970266824de3a9141ae2fee1f7b188e3f8800314ef200c0f
          name: unbound
          env:
            - name: UNBOUND_UID
              value: "1000"
            - name: UNBOUND_GID
              value: "1000"
            - name: DISABLE_SET_PERMS
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5353
              name: dns-udp
              protocol: UDP
            - containerPort: 5353
              name: dns-tcp
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 5353
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 5353
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
            requests:
              memory: 128Mi
              cpu: 100m
          volumeMounts:
            - name: config
              mountPath: /usr/local/unbound/unbound.conf
              subPath: unbound.conf
            - name: unbound-data
              mountPath: /usr/local/unbound/iana.d
              subPath: iana
      volumes:
        - name: config
          configMap:
            name: unbound-config
        - name: unbound-data
          emptyDir: {}
