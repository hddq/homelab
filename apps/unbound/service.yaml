apiVersion: v1
kind: Service
metadata:
  name: unbound-service
  namespace: unbound
spec:
  selector:
    app: unbound
  type: LoadBalancer
  loadBalancerIP: 192.168.41.11
  externalTrafficPolicy: Local
  ports:
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: 5353
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 5353
