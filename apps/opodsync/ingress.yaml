apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opodsync-ingress
  namespace: opodsync
spec:
  ingressClassName: infrastructure-traefik
  rules:
    - host: opodsync.hddq-k8s.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opodsync-service
                port:
                  number: 80
