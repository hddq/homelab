apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: opodsync
  name: opodsync
  namespace: opodsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opodsync
  # Use Recreate strategy to avoid "Multi-Attach error" with ReadWriteOnce volumes
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: opodsync
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: ganeshlab/opodsync:0.5.3-amd64@sha256:60af9a3ec7156a5da97c87f6617a879c7cb1be8c935af4a4b37da090442bc68f
          name: opodsync
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: opodsync-storage
              mountPath: /var/www/server/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: opodsync-storage
          persistentVolumeClaim:
            claimName: opodsync-pvc
        - name: tmp
          emptyDir: {}
