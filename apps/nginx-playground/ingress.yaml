apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: playground
  annotations:
    cert-manager.io/cluster-issuer: duckdns-letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - "*.skibidi12.duckdns.org"
    secretName: skibidi12-wildcard-tls
  rules:
  - host: nginx.skibidi12.duckdns.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-service
            port:
              number: 80
