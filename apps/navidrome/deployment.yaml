apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: navidrome
  labels:
    app.kubernetes.io/name: navidrome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: navidrome
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: install-lyrics-plugin
          image: curlimages/curl:8.20.0@sha256:b3f1fb2a51d923260350d21b8654bbc607164a987e2f7c84a0ac199a67df812a
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
          command:
            - sh
            - -c
            - |
              PLUGIN_VERSION="6.1.3"
              PLUGIN_PATH="/data/plugins/nd-lyrics.ndp"
              EXPECTED_VERSION_FILE="/data/plugins/.nd-lyrics-version"

              if [ -f "$EXPECTED_VERSION_FILE" ] && [ "$(cat $EXPECTED_VERSION_FILE)" = "$PLUGIN_VERSION" ]; then
                echo "Plugin already at version $PLUGIN_VERSION, skipping download"
                exit 0
              fi

              mkdir -p /data/plugins
              curl -fsSL -o "$PLUGIN_PATH" \
                "https://github.com/J0R6IT0/navidrome-lyrics-plugin/releases/download/v${PLUGIN_VERSION}/nd-lyrics.ndp"
              echo "$PLUGIN_VERSION" > "$EXPECTED_VERSION_FILE"
              echo "Plugin installed successfully"
          volumeMounts:
            - name: navidrome-pvc
              mountPath: /data
      containers:
        - name: navidrome
          image: deluan/navidrome:0.62.0@sha256:c4b5cb36a790b3eb63ca6a68bbe2fe149c2d7fa2e586f7a480e61db630e6664b
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 4533
              protocol: TCP
          env:
            - name: ND_LOGLEVEL
              value: "info"
            - name: ND_MUSICFOLDER
              value: "/music"
            - name: ND_DATAFOLDER
              value: "/data"
            - name: ND_LASTFM_APIKEY
              valueFrom:
                secretKeyRef:
                  name: navidrome-secret
                  key: ND_LASTFM_APIKEY
            - name: ND_LASTFM_SECRET
              valueFrom:
                secretKeyRef:
                  name: navidrome-secret
                  key: ND_LASTFM_SECRET
            - name: ND_PLUGINS_ENABLED
              value: "true"
            - name: ND_LYRICSPRIORITY
              value: "embedded,.lrc,nd-lyrics"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: music-nfs
              subPath: music
              mountPath: /music
              readOnly: true
            - name: lyrics-nfs
              mountPath: /music/_lyrics
              readOnly: false
            - name: navidrome-pvc
              mountPath: /data
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: music-nfs
          nfs:
            server: 192.168.20.12
            path: /mnt/ssd1/media
        - name: lyrics-nfs
          nfs:
            server: 192.168.20.12
            path: /mnt/ssd1/media/music/_lyrics
        - name: navidrome-pvc
          persistentVolumeClaim:
            claimName: navidrome-pvc
        - name: tmp-dir
          emptyDir: {}
