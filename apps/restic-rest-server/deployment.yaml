apiVersion: apps/v1
kind: Deployment
metadata:
  name: restic-rest-server
  namespace: restic
  labels:
    app.kubernetes.io/name: restic-rest-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: restic-rest-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restic-rest-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: rest-server
          image: restic/rest-server:0.14.0
          command:
            - rest-server
          args:
            - --path
            - /data
            - --private-repos
            - --htpasswd-file
            - /config/.htpasswd
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: data-hddq
              mountPath: /data/hddq
            - name: data-test
              mountPath: /data/test
            - name: htpasswd-volume
              mountPath: /config/.htpasswd
              subPath: .htpasswd
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: data-hddq
          nfs:
            server: 192.168.20.12
            path: /mnt/ssd1/backup/restic/hddq
        - name: data-test
          nfs:
            server: 192.168.20.12
            path: /mnt/ssd1/backup/restic/test
        - name: htpasswd-volume
          secret:
            secretName: restic-htpasswd
            optional: true
        - name: tmp-volume
          emptyDir: {}
