apiVersion: v1
kind: Service
metadata:
  name: graphite-exporter
  namespace: monitoring
  labels:
    app: graphite-exporter
  annotations:
    metallb.io/loadBalancerIPs: "192.168.41.12"
spec:
  type: LoadBalancer
  ports:
    - port: 9108
      targetPort: metrics
      protocol: TCP
      name: metrics
    - port: 9109
      targetPort: graphite-tcp
      protocol: TCP
      name: graphite-tcp
    - port: 9109
      targetPort: graphite-udp
      protocol: UDP
      name: graphite-udp
  selector:
    app: graphite-exporter
