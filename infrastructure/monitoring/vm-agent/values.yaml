victoria-metrics-agent:
  rbac:
    create: true
  podSecurityContext:
    enabled: true
    fsGroup: 65534
  securityContext:
    enabled: true
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  remoteWrite:
    - url: "http://vm-single-server.monitoring.svc.cluster.local:8428/api/v1/write"

  config: {}
