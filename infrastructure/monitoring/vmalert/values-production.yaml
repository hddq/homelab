victoria-metrics-alert:
  server:
    config:
      alerts:
        groups:
          - name: hardware-alerts
            rules:
              - alert: HostOutOfDiskSpace
                expr: (node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|zfs", mountpoint!~"/boot|/boot/efi"} / node_filesystem_size_bytes) * 100 < 15
                for: 1m
                labels:
                  severity: warning
                  category: hardware
                annotations:
                  summary: "Disk space running low on {{ $labels.instance }}"
                  description: "Less than 15% free space left on volume {{ $labels.mountpoint }}."

              - alert: HostOutOfMemory
                expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 15
                for: 1m
                labels:
                  severity: warning
                  category: hardware
                annotations:
                  summary: "Memory running low on {{ $labels.instance }}"
                  description: "Available RAM is under 15%."

              - alert: NodeDown
                expr: up{job=~".*node-exporter.*"} == 0
                for: 1m
                labels:
                  severity: critical
                  category: hardware
                annotations:
                  summary: "Node {{ $labels.instance }} is down"
                  description: "node-exporter scrape failed for 1 minute. The server is unreachable or the agent crashed."

              - alert: HighLoad
                expr: node_load5 > count by (instance, job) (node_cpu_seconds_total{mode="idle"})
                for: 1m
                labels:
                  severity: warning
                  category: hardware
                annotations:
                  summary: "High CPU Load on {{ $labels.instance }}"
                  description: "5-minute load average is {{ $value }}, which exceeds the total number of CPU threads. System is getting saturated."

          - name: ksm-alerts
            rules:
              - alert: PodCrashLooping
                expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} > 0
                for: 1m
                labels:
                  severity: critical
                  category: ksm
                annotations:
                  summary: "Pod {{ $labels.pod }} is crash looping"
                  description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} keeps crashing. Check the logs!"

              - alert: DeploymentReplicasMismatch
                expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
                for: 3m
                labels:
                  severity: warning
                  category: ksm
                annotations:
                  summary: "Deployment {{ $labels.deployment }} mismatch"
                  description: "Expected replicas don't match available ones. A node might be full or an image is missing/failing."

              - alert: PVCPending
                expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
                for: 3m
                labels:
                  severity: critical
                  category: ksm
                annotations:
                  summary: "PVC {{ $labels.persistentvolumeclaim }} is stuck"
                  description: "PersistentVolumeClaim in {{ $labels.namespace }} is Pending. Longhorn might have an issue provisioning the volume."

          - name: cadvisor-alerts
            rules:
              - alert: ContainerOomKillDetected
                expr: increase(container_oom_events_total{container!="", container!="POD", pod!=""}[15m]) > 0
                labels:
                  severity: critical
                  category: cadvisor
                annotations:
                  summary: "Container {{ $labels.container }} was OOM-killed"
                  description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} triggered at least one OOM event in the last 15 minutes."

              - alert: ContainerCpuThrottlingHigh
                expr: |
                  (
                    sum by (namespace, pod, container, node) (
                      increase(container_cpu_cfs_throttled_periods_total{container!="", container!="POD", pod!=""}[15m])
                    )
                    /
                    sum by (namespace, pod, container, node) (
                      increase(container_cpu_cfs_periods_total{container!="", container!="POD", pod!=""}[15m])
                    )
                  ) > 0.25
                  and
                  sum by (namespace, pod, container, node) (
                    increase(container_cpu_cfs_periods_total{container!="", container!="POD", pod!=""}[15m])
                  ) > 0
                for: 10m
                labels:
                  severity: warning
                  category: cadvisor
                annotations:
                  summary: "Container {{ $labels.container }} is being CPU-throttled"
                  description: "More than 25% of CFS periods were throttled for pod {{ $labels.namespace }}/{{ $labels.pod }} over the last 15 minutes."

              - alert: ContainerMemoryNearLimit
                expr: |
                  (
                    max by (namespace, pod, container, node) (
                      container_memory_working_set_bytes{container!="", container!="POD", pod!=""}
                    )
                    /
                    max by (namespace, pod, container, node) (
                      container_spec_memory_limit_bytes{container!="", container!="POD", pod!=""}
                    )
                  ) > 0.90
                  and
                  max by (namespace, pod, container, node) (
                    container_spec_memory_limit_bytes{container!="", container!="POD", pod!=""}
                  ) > 0
                for: 10m
                labels:
                  severity: warning
                  category: cadvisor
                annotations:
                  summary: "Container {{ $labels.container }} is close to its memory limit"
                  description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} is using more than 90% of its configured memory limit."

          - name: proxmox-alerts
            rules:
              - alert: ProxmoxNodeHighCpu
                expr: pve_cpu_usage_ratio{id=~"node/.+"} > 0.90
                for: 5m
                labels:
                  severity: warning
                  category: proxmox
                annotations:
                  summary: "High CPU usage on {{ $labels.id }}"
                  description: "Proxmox node CPU usage has been above 90% for 5 minutes."

              - alert: ProxmoxNodeHighMemory
                expr: (pve_memory_usage_bytes{id=~"node/.+"} / pve_memory_size_bytes{id=~"node/.+"}) > 0.90
                for: 10m
                labels:
                  severity: warning
                  category: proxmox
                annotations:
                  summary: "High memory usage on {{ $labels.id }}"
                  description: "Proxmox node memory usage has been above 90% for 10 minutes."

              - alert: ProxmoxStorageLowSpace
                expr: (pve_disk_usage_bytes{id=~"storage/.+"} / pve_disk_size_bytes{id=~"storage/.+"}) > 0.90
                for: 10m
                labels:
                  severity: warning
                  category: proxmox
                annotations:
                  summary: "Low storage space on {{ $labels.id }}"
                  description: "Proxmox storage usage has been above 90% for 10 minutes."
