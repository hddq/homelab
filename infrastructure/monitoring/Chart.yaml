apiVersion: v2
name: monitoring
description: A Helm chart for monitoring infrastructure (VictoriaMetrics, Grafana, Alertmanager, etc.)
type: application
version: 1.0.0
appVersion: "1.0.0"
dependencies:
  - name: alertmanager
    version: 1.34.0
    repository: https://prometheus-community.github.io/helm-charts
  - name: grafana
    version: 11.3.3
    repository: https://grafana-community.github.io/helm-charts
  - name: kube-state-metrics
    version: 7.2.1
    repository: https://prometheus-community.github.io/helm-charts
  - name: prometheus-node-exporter
    version: 4.52.1
    repository: https://prometheus-community.github.io/helm-charts
  - name: victoria-metrics-agent
    version: 0.34.0
    repository: https://victoriametrics.github.io/helm-charts
  - name: victoria-metrics-single
    version: 0.33.0
    repository: https://victoriametrics.github.io/helm-charts
  - name: victoria-metrics-alert
    version: 0.35.0
    repository: https://victoriametrics.github.io/helm-charts
