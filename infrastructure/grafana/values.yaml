grafana:
  enabled: true
  adminPassword: "admin123"
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 2Gi
  service:
    port: 80
    targetPort: 3000
  ingress:
    enabled: true
    ingressClassName: infrastructure-traefik
    hosts:
      - grafana.hddq-k8s.duckdns.org
    path: /
