grafana:
  enabled: true
  adminPassword: "admin123"
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 2Gi
  service:
    port: 80
    targetPort: 3000
  ingress:
    enabled: true
    ingressClassName: infrastructure-traefik
    hosts:
      - grafana.hddq-k8s.duckdns.org
    path: /

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: VictoriaMetrics
          type: prometheus
          access: proxy
          url: http://vm-single-server.monitoring.svc.cluster.local:8428/
          isDefault: true
          jsonData:
            prometheusType: VictoriaMetrics
            queryTimeout: 30s
            oauthPassThru: false
