apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: argocd
spec:
  ingressClassName: infrastructure-traefik
  rules:
    - host: {{ printf "argocd.%s" .Values.homelab.baseDomain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infrastructure-argocd-server
                port:
                  number: 80
