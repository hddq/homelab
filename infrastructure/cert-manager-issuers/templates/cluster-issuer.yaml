apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer.name }}
spec:
  acme:
    email: {{ .Values.clusterIssuer.email }}
    server: {{ .Values.clusterIssuer.server }}
    privateKeySecretRef:
      name: {{ .Values.clusterIssuer.privateKeySecretName }}
    solvers:
      - dns01:
          webhook:
            groupName: {{ .Values.clusterIssuer.solver.groupName }}
            solverName: {{ .Values.clusterIssuer.solver.solverName }}
            config:
              apiTokenSecretRef:
                name: {{ .Values.clusterIssuer.solver.apiTokenSecretName }}
                key: {{ .Values.clusterIssuer.solver.apiTokenSecretKey }}
