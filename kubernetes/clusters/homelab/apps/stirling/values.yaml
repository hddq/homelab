stirling-pdf-chart:
  ingress:
    enabled: true
    ingressClassName: infra-traefik
    hosts:
      - name: stirling.lab.hddq.org
        path: /
  persistence:
    enabled: true
    storageClass: openebs-hostpath
    size: 1Gi
  deployment:
    extraVolumes:
      - name: tmp
        emptyDir: {}
      - name: local-bin
        emptyDir: {}
      - name: home
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: pipeline
        emptyDir: {}
    extraVolumeMounts:
      - name: tmp
        mountPath: /tmp
      - name: local-bin
        mountPath: /usr/local/bin
      - name: home
        mountPath: /home/stirlingpdfuser
      - name: logs
        mountPath: /logs
      - name: pipeline
        mountPath: /pipeline
      - name: storage-volume
        mountPath: /configs
        subPath: configs
      - name: storage-volume
        mountPath: /storage
        subPath: storage
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  probes:
    liveness:
      initialDelaySeconds: 60
    readiness:
      initialDelaySeconds: 30
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  envs:
    - name: TZ
      value: Europe/Warsaw
    - name: SYSTEM_DEFAULTLOCALE
      value: en-US
