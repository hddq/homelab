apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-prod-cp-1
      securityContext:
        fsGroup: 1000
      containers:
        - name: gluetun
          image: ghcr.io/qdm12/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
                - CHOWN
                - SETUID
                - SETGID
                - DAC_OVERRIDE
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "private internet access"
            - name: VPN_TYPE
              value: "openvpn"
            - name: PORT_FORWARD_ONLY
              value: "on"
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: VPN_PORT_FORWARDING_PROVIDER
              value: "private internet access"
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.244.0.0/16,192.168.0.0/16"
            - name: FIREWALL_INPUT_PORTS
              value: "8080,9999"
            - name: HEALTH_SERVER_ADDRESS
              value: "0.0.0.0:9999"
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: >-
                /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences && if [ -n "$MAM_ID" ]; then echo "Updating MyAnonaMouse dynamic seedbox IP..." && wget -qO- --header="Cookie: mam_id=$MAM_ID" https://t.myanonamouse.net/json/dynamicSeedbox.php || true; fi'
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-pia-secret
                  key: OPENVPN_USER
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-pia-secret
                  key: OPENVPN_PASSWORD
            - name: SERVER_REGIONS
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-pia-secret
                  key: SERVER_REGIONS
            - name: MAM_ID
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-pia-secret
                  key: MAM_ID
                  optional: true
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
            - name: tmp-volume
              mountPath: /tmp
            - name: gluetun-data
              mountPath: /gluetun
          readinessProbe:
            httpGet:
              path: /health
              port: 9999
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9999
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: qbittorrent
          image: ghcr.io/home-operations/qbittorrent:5.2.3@sha256:4fcf15b7f265c2c8d7bc2a7e13240a07e0593c326f3cf3b5b9bb69eec5b79299
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
          volumeMounts:
            - name: qbittorrent-pvc
              mountPath: /config
            - name: media-nfs
              mountPath: /mnt/media
              readOnly: false
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: qbittorrent-pvc
          persistentVolumeClaim:
            claimName: qbittorrent-pvc
        - name: media-nfs
          nfs:
            server: 192.168.20.12
            path: /mnt/ssd1/media
        - name: tmp-volume
          emptyDir: {}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
        - name: gluetun-data
          emptyDir: {}
