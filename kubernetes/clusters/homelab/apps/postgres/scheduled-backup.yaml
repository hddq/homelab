apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-backup
  namespace: postgres
spec:
  # Weekly on Friday at 23:30
  schedule: "0 30 23 * * 5"
  backupOwnerReference: cluster
  cluster:
    name: postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
