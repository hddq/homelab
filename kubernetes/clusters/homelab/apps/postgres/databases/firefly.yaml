apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: firefly
spec:
  name: firefly
  login: true
  cluster:
    name: postgres
  passwordSecret:
    name: firefly-postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: firefly
spec:
  name: firefly
  owner: firefly
  cluster:
    name: postgres
