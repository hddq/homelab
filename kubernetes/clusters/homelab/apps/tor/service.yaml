apiVersion: v1
kind: Service
metadata:
  name: tor
  namespace: tor
  labels:
    app.kubernetes.io/name: tor
  annotations:
    lbipam.cilium.io/ips: 192.168.41.14
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: socks
      port: 9050
      targetPort: socks
      protocol: TCP
  selector:
    app.kubernetes.io/name: tor
