apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: unbound
  name: unbound
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unbound
  template:
    metadata:
      labels:
        app: unbound
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: madnuttah/unbound:1.26.0-1@sha256:a48db2fbf382cf5f5969987ef3552cbd8043cbb30817e95661ab49ec3819505c
          name: unbound
          env:
            - name: UNBOUND_UID
              value: "1000"
            - name: UNBOUND_GID
              value: "1000"
            - name: DISABLE_SET_PERMS
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5353
              name: dns-udp
              protocol: UDP
            - containerPort: 5353
              name: dns-tcp
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - drill
                - -p
                - "5353"
                - "@127.0.0.1"
                - localhost
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - drill
                - -p
                - "5353"
                - "@127.0.0.1"
                - localhost
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
            requests:
              memory: 128Mi
              cpu: 100m
          volumeMounts:
            - name: config
              mountPath: /usr/local/unbound/unbound-shared.conf
              subPath: unbound.conf
            - name: config
              mountPath: /usr/local/unbound/unbound.conf
              subPath: unbound-k8s.conf
            - name: unbound-data
              mountPath: /usr/local/unbound/iana.d
              subPath: iana
        - name: unbound-exporter
          image: ghcr.io/cyb3r-jak3/unbound-exporter:0.6.0
          args:
            - "-unbound.host=tcp://127.0.0.1:8953"
            - "-unbound.ca="
            - "-unbound.cert="
            - "-unbound.key="
          ports:
            - containerPort: 9167
              name: metrics
              protocol: TCP
          resources:
            limits:
              memory: 64Mi
              cpu: 100m
            requests:
              memory: 32Mi
              cpu: 10m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: unbound-config
        - name: unbound-data
          emptyDir: {}
