apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wealthfolio
  namespace: wealthfolio
spec:
  ingressClassName: infra-traefik
  rules:
    - host: wealthfolio.lab.hddq.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wealthfolio
                port:
                  number: 8088
