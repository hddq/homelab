immich:
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
  server:
    ingress:
      main:
        enabled: true
        className: infra-traefik
        hosts:
          - host: immich.lab.hddq.org
            paths:
              - path: /
                service:
                  identifier: main
  machine-learning:
    persistence:
      cache:
        enabled: true
        type: persistentVolumeClaim
        size: 10Gi
        accessMode: ReadWriteOnce
        storageClass: openebs-hostpath
  valkey:
    enabled: true
  controllers:
    main:
      containers:
        main:
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image:
            tag: v3.1.0
          env:
            DB_HOSTNAME: postgres-rw.postgres.svc.cluster.local
            DB_USERNAME: immich
            DB_DATABASE_NAME: immich
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-postgres
                  key: password
  immich:
    persistence:
      library:
        existingClaim: "immich-nfs-pvc"
  persistence:
    tmp:
      type: emptyDir
      globalMounts:
        - path: /tmp
  env:
    TZ: "UTC"
