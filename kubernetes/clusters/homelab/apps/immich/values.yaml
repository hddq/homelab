immich:
  defaultPodOptions:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - k8s-prod-cp-1
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
  server:
    ingress:
      main:
        enabled: true
        className: infra-traefik
        hosts:
          - host: immich.lab.hddq.org
            paths:
              - path: /
                service:
                  identifier: main
    controllers:
      main:
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
              tag: v3.4.0
              digest: sha256:7b7b575029168bfb9eb901d868ce7dbfda0d7818e78aaace29b7b8a08cd4e7d5
            env:
              DB_HOSTNAME: postgres-rw.postgres.svc.cluster.local
              DB_USERNAME: immich
              DB_DATABASE_NAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres
                    key: password
  machine-learning:
    persistence:
      cache:
        enabled: true
        type: persistentVolumeClaim
        size: 10Gi
        accessMode: ReadWriteOnce
        storageClass: openebs-hostpath
        annotations:
          k8up.io/backup: "false"
    controllers:
      main:
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-machine-learning
              tag: v3.4.0
              digest: sha256:f4e7275c9fbd956ed7bccc738ac57890bcbd9f9c17844d2ea0b137e38a083454
  valkey:
    enabled: true
  controllers:
    main:
      containers:
        main:
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

  immich:
    persistence:
      library:
        existingClaim: "immich-nfs-pvc"
  persistence:
    tmp:
      type: emptyDir
      globalMounts:
        - path: /tmp
  env:
    TZ: "Europe/Warsaw"
