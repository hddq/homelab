apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: searxng-ingress
  namespace: searxng
spec:
  ingressClassName: infrastructure-traefik
  rules:
    - host: searxng.lab.hddq.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: searxng-service
                port:
                  number: 80
