apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: navidrome
  labels:
    app.kubernetes.io/name: navidrome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: navidrome
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-prod-cp-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: install-plugins
          image: curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
          command:
            - sh
            - -c
            - |
              mkdir -p /data/plugins

              # Install Lyrics Plugin
              LYRICS_VERSION="7.2.0"
              LYRICS_PATH="/data/plugins/nd-lyrics.ndp"
              LYRICS_VERSION_FILE="/data/plugins/.nd-lyrics-version"

              if [ ! -f "$LYRICS_VERSION_FILE" ] || [ "$(cat $LYRICS_VERSION_FILE 2>/dev/null)" != "$LYRICS_VERSION" ]; then
                echo "Downloading nd-lyrics version $LYRICS_VERSION..."
                curl -fsSL -o "$LYRICS_PATH" \
                  "https://github.com/J0R6IT0/navidrome-lyrics-plugin/releases/download/v${LYRICS_VERSION}/nd-lyrics.ndp"
                echo "$LYRICS_VERSION" > "$LYRICS_VERSION_FILE"
              fi

              # Install AudioMuse-AI Plugin
              AUDIOMUSE_VERSION="v9"
              AUDIOMUSE_PATH="/data/plugins/audiomuseai.ndp"
              AUDIOMUSE_VERSION_FILE="/data/plugins/.audiomuseai-version"

              if [ ! -f "$AUDIOMUSE_VERSION_FILE" ] || [ "$(cat $AUDIOMUSE_VERSION_FILE 2>/dev/null)" != "$AUDIOMUSE_VERSION" ]; then
                echo "Downloading audiomuseai version $AUDIOMUSE_VERSION..."
                curl -fsSL -o "$AUDIOMUSE_PATH" \
                  "https://github.com/NeptuneHub/AudioMuse-AI-NV-plugin/releases/download/${AUDIOMUSE_VERSION}/audiomuseai.ndp"
                echo "$AUDIOMUSE_VERSION" > "$AUDIOMUSE_VERSION_FILE"
              fi

              echo "Plugins verified"
          volumeMounts:
            - name: navidrome-pvc
              mountPath: /data
      containers:
        - name: navidrome
          image: deluan/navidrome:0.63.2@sha256:9012939114fbb1bb641b81cf96dec5ded15f0aafefe8d47a511d7cb919658e40
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 4533
              protocol: TCP
          env:
            - name: ND_CONFIGFILE
              value: "/config/navidrome.toml"
            - name: ND_LASTFM_APIKEY
              valueFrom:
                secretKeyRef:
                  name: navidrome-secret
                  key: ND_LASTFM_APIKEY
            - name: ND_LASTFM_SECRET
              valueFrom:
                secretKeyRef:
                  name: navidrome-secret
                  key: ND_LASTFM_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config-volume
              mountPath: /config
            - name: music-nfs
              subPath: music
              mountPath: /music
              readOnly: true
            - name: lyrics-nfs
              mountPath: /music/_lyrics
              readOnly: false
            - name: navidrome-pvc
              mountPath: /data
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: config-volume
          configMap:
            name: navidrome-config
        - name: music-nfs
          nfs:
            server: 192.168.20.12
            path: /mnt/ssd1/media
        - name: lyrics-nfs
          nfs:
            server: 192.168.20.12
            path: /mnt/ssd1/media/music/_lyrics
        - name: navidrome-pvc
          persistentVolumeClaim:
            claimName: navidrome-pvc
        - name: tmp-dir
          emptyDir: {}
