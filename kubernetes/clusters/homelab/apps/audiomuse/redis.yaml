apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiomuse-redis
  namespace: audiomuse
  labels:
    app.kubernetes.io/name: audiomuse-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audiomuse-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiomuse-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: audiomuse-redis
  namespace: audiomuse
  labels:
    app.kubernetes.io/name: audiomuse-redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: audiomuse-redis
