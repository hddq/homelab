apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiomuse-redis
  namespace: audiomuse
  labels:
    app.kubernetes.io/name: audiomuse-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audiomuse-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiomuse-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: redis-data
          emptyDir: {}
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: audiomuse-redis
  namespace: audiomuse
  labels:
    app.kubernetes.io/name: audiomuse-redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: audiomuse-redis
