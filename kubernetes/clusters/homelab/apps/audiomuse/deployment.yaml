apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiomuse
  namespace: audiomuse
  labels:
    app.kubernetes.io/name: audiomuse
    app.kubernetes.io/component: flask
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: audiomuse
      app.kubernetes.io/component: flask
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiomuse
        app.kubernetes.io/component: flask
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - "until nc -z postgres-rw.postgres.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done"
      containers:
        - name: audiomuse-flask
          image: ghcr.io/neptunehub/audiomuse-ai:3.5.0@sha256:244bb151e3aa1a39730be82d92f93e90f8ea0ca79548ba6bcc8aa6dd344eebf6
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: SERVICE_TYPE
              value: "flask"
            - name: POSTGRES_HOST
              value: "postgres-rw.postgres.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: audiomuse-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audiomuse-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: audiomuse-secret
                  key: POSTGRES_DB
            - name: TZ
              value: "UTC"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: music-nfs
              subPath: music
              mountPath: /music
              readOnly: true
            - name: tmp-dir
              mountPath: /tmp
            - name: temp-audio
              mountPath: /app/temp_audio
      volumes:
        - name: music-nfs
          nfs:
            server: 192.168.20.12
            path: /mnt/ssd1/media
        - name: tmp-dir
          emptyDir: {}
        - name: temp-audio
          emptyDir: {}
---
