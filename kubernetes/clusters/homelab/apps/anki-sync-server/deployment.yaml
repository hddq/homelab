apiVersion: apps/v1
kind: Deployment
metadata:
  name: anki-sync-server
  namespace: anki-sync-server
  labels:
    app.kubernetes.io/name: anki-sync-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: anki-sync-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anki-sync-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anki-sync-server
          image: jeankhawand/anki-sync-server:26.05-distroless
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SYNC_USER1
              valueFrom:
                secretKeyRef:
                  name: anki-sync-server-secret
                  key: SYNC_USER1
            - name: SYNC_PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /anki_data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: anki-sync-server-pvc
