# Namespaces to INCLUDE for backups.
# Only these namespaces will get a K8up Schedule automatically.
# Individual PVCs can still be excluded by annotating them: k8up.io/backup: "false"
includeNamespaces:
  - anki-sync-server
  - media
  - monitoring
  - navidrome
  - opodsync

# S3-compatible backend (Garage on TrueNAS).
s3:
  endpoint: http://192.168.20.12:30188
  bucket: kubernetes-backups

backup:
  # Daily at 23:55
  schedule: "55 23 * * *"

prune:
  # Weekly on Sunday at 04:00
  schedule: "0 4 * * 0"
  retention:
    keepLast: 7
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 3

check:
  # Weekly on Sunday at 05:00
  schedule: "0 5 * * 0"
