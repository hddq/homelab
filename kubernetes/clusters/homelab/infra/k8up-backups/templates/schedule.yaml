{{- /*
  Generates a K8up Schedule in each namespace specified in includeNamespaces.

  All Schedules point to the same S3 bucket → single restic repo.

  Credentials:
  - Repo password:    BACKUP_GLOBALREPOPASSWORD on the operator
  - S3 access key:    BACKUP_GLOBALACCESSKEYID on the operator
  - S3 secret key:    BACKUP_GLOBALSECRETACCESSKEY on the operator
*/ -}}
{{- range $name := .Values.includeNamespaces }}
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: daily-backup
  namespace: {{ $name }}
spec:
  backend:
    s3:
      endpoint: {{ $.Values.s3.endpoint }}
      bucket: {{ $.Values.s3.bucket }}
  backup:
    schedule: {{ $.Values.backup.schedule | quote }}
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 2
  prune:
    schedule: {{ $.Values.prune.schedule | quote }}
    retention:
      keepLast: {{ $.Values.prune.retention.keepLast }}
      keepDaily: {{ $.Values.prune.retention.keepDaily }}
      keepWeekly: {{ $.Values.prune.retention.keepWeekly }}
      keepMonthly: {{ $.Values.prune.retention.keepMonthly }}
  check:
    schedule: {{ $.Values.check.schedule | quote }}
{{- end }}
