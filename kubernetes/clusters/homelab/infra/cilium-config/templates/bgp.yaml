apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: openwrt-peer-config
spec:
  timers:
    holdTimeSeconds: 90
    keepAliveTimeSeconds: 30
  ebgpMultihop: 1
  families:
    - afi: "ipv4"
      safi: "unicast"
      advertisements:
        matchLabels:
          advertise: "bgp"
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: bgp-advertisements
  labels:
    advertise: "bgp"
spec:
  advertisements:
    - advertisementType: "Service"
      service:
        addresses:
          - "LoadBalancerIP"
      selector:
        matchExpressions:
          - key: "io.cilium/no-bgp-advertisement"
            operator: "DoesNotExist"
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: cilium-bgp-cluster-config
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: "openwrt"
      localASN: {{ .Values.homelab.cilium.myASN }}
      peers:
        - name: "openwrt-router"
          peerAddress: {{ .Values.homelab.cilium.peerAddress | quote }}
          peerASN: {{ .Values.homelab.cilium.peerASN }}
          peerConfigRef:
            name: "openwrt-peer-config"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: default-pool
spec:
  blocks:
    {{- range .Values.homelab.cilium.addressPools }}
    - start: {{ .start | quote }}
      stop: {{ .stop | quote }}
    {{- end }}
