misconfigurations:
  - id: KSV-0044
    statement: ArgoCD Application Controller needs wildcard permissions to manage all resources in the cluster (GitOps).
    paths:
      - "argocd/charts/argo-cd/templates/argocd-application-controller/clusterrole.yaml"

  - id: KSV-0046
    statement: ArgoCD, Cert-Manager, OpenEBS and K8up components require wildcard resource access for broad cluster/namespace management.
    paths:
      - "argocd/charts/argo-cd/templates/argocd-application-controller/clusterrole.yaml"
      - "argocd/charts/argo-cd/templates/argocd-server/clusterrole.yaml"
      - "openebs/charts/openebs/charts/localpv-provisioner/templates/rbac.yaml"
      - "k8up/charts/k8up/templates/user-clusterrole.yaml"

  - id: KSV-0053
    statement: K8up executor and CloudNativePG require pods/exec permission to run application pre/post backup commands inside target containers and manage databases.
    paths:
      - "k8up/charts/k8up/templates/executor-clusterrole.yaml"
      - "cloudnative-pg/charts/cloudnative-pg/templates/rbac.yaml"

  - id: KSV-0041
    statement: Infrastructure components (ArgoCD, Traefik, Cert-Manager, CloudNativePG, Cilium) require secret access for credentials, certificates, unsealing operations, or CNI/BGP management.
    paths:
      - "argocd/charts/argo-cd/templates/argocd-notifications/clusterrole.yaml"
      - "traefik/charts/traefik/templates/rbac/clusterrole.yaml"
      - "cert-manager/charts/cert-manager/templates/cainjector-rbac.yaml"
      - "cert-manager/charts/cert-manager/templates/rbac.yaml"
      - "cloudnative-pg/charts/cloudnative-pg/templates/rbac.yaml"
      - "plugin-barman-cloud/charts/plugin-barman-cloud/templates/rbac.yaml"
      - "charts/plugin-barman-cloud/templates/rbac.yaml"
      - "cilium/charts/cilium/templates/cilium-operator/clusterrole.yaml"
      - "charts/cilium/templates/cilium-operator/clusterrole.yaml"

  - id: KSV-0118
    statement: Third-party Helm charts often use default security contexts; fixing requires specific chart support in values.yaml. openebs and cilium use default contexts.
    paths:
      - "openebs/charts/openebs/charts/localpv-provisioner/templates/deployment.yaml"
      - "cilium/charts/cilium/templates/cilium-envoy/daemonset.yaml"
      - "charts/cilium/templates/cilium-envoy/daemonset.yaml"

  - id: KSV-0014
    statement: Infrastructure components (OpenEBS, Cilium) require writable FS for eBPF maps, sockets, binaries, or backup operations.
    paths:
      - "openebs/charts/openebs/charts/localpv-provisioner/templates/deployment.yaml"
      - "cilium/charts/cilium/templates/cilium-agent/daemonset.yaml"
      - "cilium/charts/cilium/templates/cilium-envoy/daemonset.yaml"
      - "cilium/charts/cilium/templates/cilium-operator/deployment.yaml"
      - "cilium/charts/cilium/templates/hubble-ui/deployment.yaml"
      - "charts/cilium/templates/cilium-agent/daemonset.yaml"
      - "charts/cilium/templates/cilium-envoy/daemonset.yaml"
      - "charts/cilium/templates/cilium-operator/deployment.yaml"
      - "charts/cilium/templates/hubble-ui/deployment.yaml"

  - id: KSV-0045
    statement: OpenEBS roles require broad permissions to manage storage resources, volumes, namespaces, pods, and endpoints.
    paths:
      - "openebs/charts/openebs/charts/localpv-provisioner/templates/rbac.yaml"

  - id: KSV-0056
    statement: Cert-Manager, OpenEBS and CloudNativePG may need to manage network policies, endpoints, services, or resources for internal communication and high availability.
    paths:
      - "cert-manager/charts/cert-manager/templates/rbac.yaml"
      - "openebs/charts/openebs/charts/localpv-provisioner/templates/rbac.yaml"
      - "cloudnative-pg/charts/cloudnative-pg/templates/rbac.yaml"

  - id: KSV-0114
    statement: Cert-Manager and CloudNativePG manage their own mutating/validating webhooks for configuration and validation.
    paths:
      - "cloudnative-pg/charts/cloudnative-pg/templates/rbac.yaml"
      - "cert-manager/charts/cert-manager/templates/cainjector-rbac.yaml"

  - id: KSV-0005
    statement: Cilium agent and envoy require SYS_ADMIN capability for eBPF map loading, tracing, and network routing.
    paths:
      - "cilium/charts/cilium/templates/cilium-agent/daemonset.yaml"
      - "cilium/charts/cilium/templates/cilium-envoy/daemonset.yaml"
      - "charts/cilium/templates/cilium-agent/daemonset.yaml"
      - "charts/cilium/templates/cilium-envoy/daemonset.yaml"

  - id: KSV-0009
    statement: Networking components (node-exporter, Cilium) MUST use hostNetwork to observe metrics and manage host network stack/BGP.
    paths:
      - "monitoring/node-exporter/charts/prometheus-node-exporter/templates/daemonset.yaml"
      - "cilium/charts/cilium/templates/cilium-agent/daemonset.yaml"
      - "cilium/charts/cilium/templates/cilium-envoy/daemonset.yaml"
      - "cilium/charts/cilium/templates/cilium-operator/deployment.yaml"
      - "charts/cilium/templates/cilium-agent/daemonset.yaml"
      - "charts/cilium/templates/cilium-envoy/daemonset.yaml"
      - "charts/cilium/templates/cilium-operator/deployment.yaml"

  - id: KSV-0010
    statement: node-exporter uses hostPID to observe host process and kernel metrics as designed.
    paths:
      - "monitoring/node-exporter/charts/prometheus-node-exporter/templates/daemonset.yaml"

  - id: KSV-0017
    statement: Cilium agent requires privileged permissions to manipulate kernel eBPF programs and network interfaces.
    paths:
      - "cilium/charts/cilium/templates/cilium-agent/daemonset.yaml"
      - "charts/cilium/templates/cilium-agent/daemonset.yaml"

  - id: KSV-0024
    statement: Cilium components expose host ports for health endpoints, metrics, and Envoy proxying.
    paths:
      - "cilium/charts/cilium/templates/cilium-agent/daemonset.yaml"
      - "cilium/charts/cilium/templates/cilium-envoy/daemonset.yaml"
      - "cilium/charts/cilium/templates/cilium-operator/deployment.yaml"
      - "charts/cilium/templates/cilium-agent/daemonset.yaml"
      - "charts/cilium/templates/cilium-envoy/daemonset.yaml"
      - "charts/cilium/templates/cilium-operator/deployment.yaml"

  - id: KSV-0109
    statement: Cilium ConfigMap contains non-sensitive configuration keys flagged by generic secret scanning heuristic.
    paths:
      - "cilium/charts/cilium/templates/cilium-configmap.yaml"
      - "charts/cilium/templates/cilium-configmap.yaml"

  - id: KSV-0119
    statement: Cilium agent requires NET_RAW capability for raw network packet processing.
    paths:
      - "cilium/charts/cilium/templates/cilium-agent/daemonset.yaml"
      - "charts/cilium/templates/cilium-agent/daemonset.yaml"

  - id: KSV-0121
    statement: node-exporter and Cilium intentionally mount host root, proc, sys, bpf, and cgroup filesystems.
    paths:
      - "monitoring/node-exporter/charts/prometheus-node-exporter/templates/daemonset.yaml"
      - "cilium/charts/cilium/templates/cilium-agent/daemonset.yaml"
      - "charts/cilium/templates/cilium-agent/daemonset.yaml"
