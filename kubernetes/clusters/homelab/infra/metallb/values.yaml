homelab:
  metallb:
    myASN: 65001
    peerASN: 65000
    peerAddress: 192.168.20.1
    addressPool:
      - 192.168.41.10-192.168.41.250

metallb:
  speaker:
    # Allow MetalLB to announce BGP routes on single-node / control-plane nodes
    # despite Talos setting 'node.kubernetes.io/exclude-from-external-load-balancers'
    ignoreExcludeLB: true
  prometheus:
    serviceMonitor:
      enabled: false
    podMonitor:
      enabled: false
  frr-k8s:
    frrk8s:
      frr:
        image:
          # Default FRR image in chart (10.4.3) fails with 'exec format error' on CPUs lacking Intel CET (e.g. Core i3-8100 on worker-1).
          # 10.7.0 includes fixed upstream multi-arch compilation flags that run on all x86_64 CPUs.
          # Can be removed once MetalLB updates its bundled subchart default to 10.7.0+.
          tag: "10.7.0"
    prometheus:
      serviceMonitor:
        enabled: false
