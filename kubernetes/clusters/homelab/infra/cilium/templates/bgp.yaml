apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: default-pool
spec:
  blocks:
    {{- range .Values.homelab.cilium.addressPools }}
    - start: {{ .start | quote }}
      stop: {{ .stop | quote }}
    {{- end }}
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPPeeringPolicy
metadata:
  name: bgp-peering-policy
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  virtualRouters:
    - localASN: {{ .Values.homelab.cilium.myASN }}
      exportPodCIDR: false
      neighbors:
        - peerAddress: {{ printf "%s/32" .Values.homelab.cilium.peerAddress | quote }}
          peerASN: {{ .Values.homelab.cilium.peerASN }}
      serviceSelector:
        matchExpressions:
          - key: "io.cilium/no-bgp-advertisement"
            operator: "DoesNotExist"
