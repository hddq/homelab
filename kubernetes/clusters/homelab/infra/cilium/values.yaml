homelab:
  cilium:
    peerAddress: "192.168.20.1"
    peerASN: 65000
    myASN: 65001
    addressPools:
      - start: "192.168.41.10"
        stop: "192.168.41.250"

cilium:
  ipam:
    mode: "kubernetes"
  kubeProxyReplacement: true
  k8sServiceHost: "127.0.0.1"
  k8sServicePort: 7445
  cgroup:
    autoMount:
      enabled: false
    hostRoot: "/sys/fs/cgroup"
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE
  bgpControlPlane:
    enabled: true
  rollOutCiliumPods: true
  operator:
    replicas: 1
    rollOutPods: true
