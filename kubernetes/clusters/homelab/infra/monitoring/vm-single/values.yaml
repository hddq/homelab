victoria-metrics-single:
  server:
    securityContext:
      enabled: true
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    podSecurityContext:
      enabled: true
      fsGroup: 65534
    fullnameOverride: "vm-single-server"
    terminationGracePeriodSeconds: 120
    persistentVolume:
      enabled: true
      storageClass: "openebs-hostpath"
      size: 10Gi
      annotations:
        k8up.io/backup: "false"

    service:
      type: ClusterIP
      servicePort: 8428

    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 512Mi

    retentionPeriod: 1 # month
