alertmanager:
  enabled: true
  securityContext:
    readOnlyRootFilesystem: true
  persistence:
    enabled: true
    storageClassName: openebs-hostpath
    size: 2Gi
  ingress:
    enabled: true
    className: infra-traefik

  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["..."]
      group_wait: 0s
      group_interval: 30s
      repeat_interval: 12h
      receiver: "telegram-default"
      routes:
        - matchers:
            - category="hardware"
            - job="k8s-node-exporter"
          receiver: "telegram-k8s-hardware"
        - matchers:
            - category="hardware"
            - job="proxmox-node-exporter"
          receiver: "telegram-pve-hardware"
        - matchers:
            - category="hardware"
          receiver: "telegram-k8s-hardware"
        - matchers:
            - category="proxmox"
          receiver: "telegram-proxmox"
        - matchers:
            - category="ksm"
          receiver: "telegram-ksm"
        - matchers:
            - category="cadvisor"
          receiver: "telegram-cadvisor"

    receivers:
      - name: "telegram-default"
        telegram_configs:
          - <<: &telegram_base
              bot_token_file: /etc/alertmanager/secrets/bot-token
              chat_id: -1003558340282
              parse_mode: HTML
              message: |-
                {{- if eq .Status "firing" }}🔥 <b>FIRING</b> 🔥{{ "\n" }}{{- else }}✅ <b>RESOLVED</b> ✅{{ "\n" }}{{- end }}
                {{- range .Alerts }}
                🚨 <b>{{ .Labels.alertname }}</b> [{{ .Labels.severity }}]
                {{- if .Annotations.summary }}{{ "\n" }}📝 <b>Summary:</b> {{ .Annotations.summary }}{{- end }}
                {{- if .Annotations.description }}{{ "\n" }}📄 <b>Details:</b> {{ .Annotations.description }}{{- end }}
                {{- if .Labels.cluster }}{{ "\n" }}🌐 <b>Cluster:</b> <code>{{ .Labels.cluster }}</code>{{- end }}
                {{ "\n" }}🏷️ <b>Labels:</b>
                {{- range $key, $value := .Labels }}
                {{- if and (ne $key "alertname") (ne $key "severity") (ne $key "category") (ne $key "cluster") }}
                ├ <b>{{ $key }}:</b> <code>{{ $value }}</code>
                {{- end }}
                {{- end }}
                ⏱ <b>Started:</b> <code>{{ .StartsAt.Format "2006-01-02 15:04:05" }}</code>
                {{- end }}
            message_thread_id: 164

      - name: "telegram-k8s-hardware"
        telegram_configs:
          - <<: *telegram_base
            message_thread_id: 3

      - name: "telegram-pve-hardware"
        telegram_configs:
          - <<: *telegram_base
            message_thread_id: 133

      - name: "telegram-proxmox"
        telegram_configs:
          - <<: *telegram_base
            message_thread_id: 87

      - name: "telegram-ksm"
        telegram_configs:
          - <<: *telegram_base
            message_thread_id: 28

      - name: "telegram-cadvisor"
        telegram_configs:
          - <<: *telegram_base
            message_thread_id: 58

  extraSecretMounts:
    - name: telegram-secret
      mountPath: /etc/alertmanager/secrets
      secretName: alertmanager-telegram
      readOnly: true
