clusterName: ${CLUSTER_NAME}
endpoint: https://${CLUSTER_ENDPOINT}:6443

nodes:
  - hostname: k8s-prod-cp-1
    ipAddress: 192.168.20.100
    controlPlane: true
    installDisk: /dev/vda
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.20.100/24
        routes:
          - network: 0.0.0.0/0
            gateway: ${GATEWAY}
    nameservers:
      - ${NAMESERVER_PRIMARY}
      - ${NAMESERVER_SECONDARY}
      - ${NAMESERVER_TERTIARY}

  - hostname: k8s-prod-worker-1
    ipAddress: 192.168.20.101
    controlPlane: false
    installDisk: /dev/vda
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.20.101/24
        routes:
          - network: 0.0.0.0/0
            gateway: ${GATEWAY}
    nameservers:
      - ${NAMESERVER_PRIMARY}
      - ${NAMESERVER_SECONDARY}
      - ${NAMESERVER_TERTIARY}
