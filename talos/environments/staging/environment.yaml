clusterName: ${CLUSTER_NAME}
endpoint: https://${CLUSTER_ENDPOINT}:6443

nodes:
  - hostname: k8s-staging-1
    ipAddress: 192.168.20.120
    controlPlane: true
    installDisk: /dev/sda
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.20.120/24
        routes:
          - network: 0.0.0.0/0
            gateway: ${GATEWAY}
    nameservers:
      - ${NAMESERVER_PRIMARY}
      - ${NAMESERVER_SECONDARY}
      - ${NAMESERVER_TERTIARY}
