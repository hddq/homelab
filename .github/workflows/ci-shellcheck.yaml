name: CI - ShellCheck

on:
  push:
    branches: ["master"]
    paths:
      - "**/*.sh"
  pull_request:
    branches: ["master"]
    paths:
      - "**/*.sh"

jobs:
  shellcheck:
    name: 🐚 ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: .ansible
