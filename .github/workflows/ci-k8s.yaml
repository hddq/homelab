name: CI - Kubernetes

on:
  workflow_call:

jobs:
  helm-build:
    name: ⎈ Build Helm Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Build Helm dependencies for infra/
        run: bash scripts/ci/infrastructure-charts.sh build-deps

      - name: Upload built infrastructure charts
        uses: actions/upload-artifact@v7
        with:
          name: helm-dependencies
          path: kubernetes/clusters/homelab/infra/

  kubeconform:
    name: ☸️ Validate K8s Manifests
    runs-on: ubuntu-latest
    needs: [helm-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download built infrastructure charts
        uses: actions/download-artifact@v8
        with:
          name: helm-dependencies
          path: kubernetes/clusters/homelab/infra/

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Render bootstrap chart
        run: |
          mkdir -p .ci/rendered
          helm template homelab-bootstrap ./kubernetes/clusters/homelab/bootstrap > .ci/rendered/bootstrap.yaml

      - name: Render infrastructure charts
        run: |
          bash scripts/ci/infrastructure-charts.sh render .ci/rendered/infrastructure

      - name: Run kubeconform
        run: |
          mapfile -t manifest_files < <(bash scripts/ci/kubeconform-files.sh kubernetes/clusters/homelab/apps .ci/rendered)

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/yannh/kubeconform:v0.7.0-alpine \
            -summary -strict \
            -ignore-missing-schemas \
            -ignore-filename-pattern 'Chart.yaml|values.*\.yaml|.trivyignore.yaml' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "${manifest_files[@]}"

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0

      - name: Run Kyverno validation
        run: |
          mapfile -t manifest_files < <(find kubernetes/clusters/homelab/apps/ .ci/rendered/ -type f \( -name "*.yaml" -o -name "*.yml" \) -exec grep -q "apiVersion:" {} \; -print)
          resources=()
          for file in "${manifest_files[@]}"; do
            resources+=("--resource" "$file")
          done
          kyverno apply kubernetes/policies/ "${resources[@]}"

  trivy:
    name: 🛡️ Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [helm-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download built infrastructure charts
        uses: actions/download-artifact@v8
        with:
          name: helm-dependencies
          path: kubernetes/clusters/homelab/infra/

      - name: Run Trivy on apps/
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: kubernetes/clusters/homelab/apps/.trivyignore.yaml
        with:
          scan-type: "config"
          hide-progress: true
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          scan-ref: "kubernetes/clusters/homelab/apps/"

      - name: Run Trivy on infra/
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: kubernetes/clusters/homelab/infra/.trivyignore.yaml
        with:
          scan-type: "config"
          hide-progress: true
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          scan-ref: "kubernetes/clusters/homelab/infra/"

  pluto:
    name: ♇ Pluto (API Deprecations)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Pluto
        uses: FairwindsOps/pluto/github-action@v5.24.1

      - name: Use pluto
        run: |
          K3S_VER=$(cat k3s_version.txt)
          echo "k3s version: $K3S_VER"
          pluto detect-files -d . --target-versions k8s=${K3S_VER%+*}

  helm-lint:
    name: ⎈ Helm Lint
    runs-on: ubuntu-latest
    needs: [helm-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download built infrastructure charts
        uses: actions/download-artifact@v8
        with:
          name: helm-dependencies
          path: kubernetes/clusters/homelab/infra/

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Run Helm Lint
        run: bash scripts/ci/infrastructure-charts.sh lint
