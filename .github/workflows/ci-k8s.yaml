name: CI - Kubernetes

on:
  push:
    branches: ["master"]
    paths:
      - "apps/**"
      - "infrastructure/**"
      - "bootstrap/**"
      - "k3s_version.txt"
      - ".github/workflows/ci-k8s.yaml"
      - "scripts/ci/**"
  pull_request:
    branches: ["master"]
    paths:
      - "apps/**"
      - "infrastructure/**"
      - "bootstrap/**"
      - "k3s_version.txt"
      - ".github/workflows/ci-k8s.yaml"
      - "scripts/ci/**"

jobs:
  helm-build:
    name: ⎈ Build Helm Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Build Helm dependencies for infrastructure/
        run: bash scripts/ci/infrastructure-charts.sh build-deps

      - name: Upload built infrastructure charts
        uses: actions/upload-artifact@v7
        with:
          name: helm-dependencies
          path: infrastructure/

  kubeconform:
    name: ☸️ Validate K8s Manifests
    runs-on: ubuntu-latest
    needs: [helm-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download built infrastructure charts
        uses: actions/download-artifact@v8
        with:
          name: helm-dependencies
          path: infrastructure/

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Render bootstrap chart
        run: |
          mkdir -p .ci/rendered
          helm template homelab-bootstrap ./bootstrap > .ci/rendered/bootstrap.yaml

      - name: Render infrastructure charts
        run: |
          bash scripts/ci/infrastructure-charts.sh render .ci/rendered/infrastructure

      - name: Run kubeconform
        run: |
          mapfile -t manifest_files < <(bash scripts/ci/kubeconform-files.sh apps .ci/rendered)

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/yannh/kubeconform:v0.7.0-alpine \
            -summary -strict \
            -ignore-missing-schemas \
            -ignore-filename-pattern 'Chart.yaml|values.*\.yaml|.trivyignore.yaml' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "${manifest_files[@]}"

  trivy:
    name: 🛡️ Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [helm-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download built infrastructure charts
        uses: actions/download-artifact@v8
        with:
          name: helm-dependencies
          path: infrastructure/

      - name: Run Trivy on apps/
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: apps/.trivyignore.yaml
        with:
          scan-type: "config"
          hide-progress: true
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          scan-ref: "apps/"

      - name: Run Trivy on infrastructure/
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: infrastructure/.trivyignore.yaml
        with:
          scan-type: "config"
          hide-progress: true
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          scan-ref: "infrastructure/"

  pluto:
    name: ♇ Pluto (API Deprecations)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Pluto
        uses: FairwindsOps/pluto/github-action@v5.24.0

      - name: Use pluto
        run: |
          K3S_VER=$(cat k3s_version.txt)
          echo "k3s version: $K3S_VER"
          pluto detect-files -d . --target-versions k8s=${K3S_VER%+*}

  helm-lint:
    name: ⎈ Helm Lint
    runs-on: ubuntu-latest
    needs: [helm-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download built infrastructure charts
        uses: actions/download-artifact@v8
        with:
          name: helm-dependencies
          path: infrastructure/

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Run Helm Lint
        run: bash scripts/ci/infrastructure-charts.sh lint
