name: CI - Kubernetes

on:
  push:
    branches: ["master"]
    paths:
      - "apps/**"
      - "infrastructure/**"
      - "bootstrap/**"
      - "k3s_version.txt"
      - ".github/workflows/ci-k8s.yaml"
  pull_request:
    branches: ["master"]
    paths:
      - "apps/**"
      - "infrastructure/**"
      - "bootstrap/**"
      - "k3s_version.txt"
      - ".github/workflows/ci-k8s.yaml"

jobs:
  helm-build:
    name: ⎈ Build Helm Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Build Helm dependencies for infrastructure/
        run: |
          mapfile -t charts < <(find infrastructure -name Chart.yaml | sort)
          mapfile -t repos < <(awk '/repository:/ { print $2 }' "${charts[@]}" | sort -u)
          for i in "${!repos[@]}"; do
            helm repo add "repo-$i" "${repos[$i]}"
          done

          helm repo update

          while IFS= read -r chart_file; do
            dir="$(dirname "$chart_file")"
            echo "Building dependencies for $dir"
            helm dependency build "$dir"
          done < <(printf '%s\n' "${charts[@]}")

      - name: Upload built infrastructure charts
        uses: actions/upload-artifact@v7
        with:
          name: helm-dependencies
          path: infrastructure/

  kubeconform:
    name: ☸️ Validate K8s Manifests
    runs-on: ubuntu-latest
    needs: [helm-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download built infrastructure charts
        uses: actions/download-artifact@v8
        with:
          name: helm-dependencies
          path: infrastructure/

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Render bootstrap chart
        run: |
          mkdir -p .ci/rendered
          helm template homelab-bootstrap ./bootstrap > .ci/rendered/bootstrap.yaml

      - name: Render infrastructure charts
        run: |
          mkdir -p .ci/rendered/infrastructure
          while IFS= read -r chart_file; do
            chart_dir="$(dirname "$chart_file")"
            chart_id="${chart_dir#infrastructure/}"
            chart_id="${chart_id//\//-}"
            release="infrastructure-$chart_id"

            for env in staging production; do
              args=()
              [ -f "$chart_dir/values.yaml" ] && args+=(-f "$chart_dir/values.yaml")
              [ -f "$chart_dir/values-$env.yaml" ] && args+=(-f "$chart_dir/values-$env.yaml")

              echo "Rendering $chart_id for $env environment"
              helm template "$release" "$chart_dir" "${args[@]}" \
                > ".ci/rendered/infrastructure/${chart_id}-${env}.yaml"
            done
          done < <(find infrastructure -name Chart.yaml | sort)

      - name: Run kubeconform
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/yannh/kubeconform:v0.7.0-alpine \
            -summary -strict \
            -ignore-missing-schemas \
            -ignore-filename-pattern 'Chart.yaml|values.*\.yaml|.trivyignore.yaml' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            apps/ .ci/rendered/

  trivy:
    name: 🛡️ Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [helm-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download built infrastructure charts
        uses: actions/download-artifact@v8
        with:
          name: helm-dependencies
          path: infrastructure/

      - name: Run Trivy on apps/
        uses: aquasecurity/trivy-action@0.35.0
        env:
          TRIVY_IGNOREFILE: apps/.trivyignore.yaml
        with:
          scan-type: "config"
          hide-progress: true
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          scan-ref: "apps/"

      - name: Run Trivy on infrastructure/
        uses: aquasecurity/trivy-action@0.35.0
        env:
          TRIVY_IGNOREFILE: infrastructure/.trivyignore.yaml
        with:
          scan-type: "config"
          hide-progress: true
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          scan-ref: "infrastructure/"

  pluto:
    name: ♇ Pluto (API Deprecations)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Pluto
        uses: FairwindsOps/pluto/github-action@v5.23.5

      - name: Use pluto
        run: |
          K3S_VER=$(cat k3s_version.txt)
          echo "k3s version: $K3S_VER"
          pluto detect-files -d . --target-versions k8s=${K3S_VER%+*}

  helm-lint:
    name: ⎈ Helm Lint
    runs-on: ubuntu-latest
    needs: [helm-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download built infrastructure charts
        uses: actions/download-artifact@v8
        with:
          name: helm-dependencies
          path: infrastructure/

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Run Helm Lint
        run: |
          while IFS= read -r chart_file; do
            dir="$(dirname "$chart_file")"
            echo "Linting $dir"
            helm lint "$dir"
          done < <(find infrastructure -name Chart.yaml | sort)
