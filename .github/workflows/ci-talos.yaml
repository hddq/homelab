name: CI - Talos

on:
  workflow_call:

jobs:
  validate:
    name: ⚙️ Validate Talos Configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install talosctl
        run: |
          talos_version="$(awk '/^TALOS_VERSION:/ { print $2 }' talos/versions.yaml)"
          curl -fsSL -o /tmp/talosctl "https://github.com/siderolabs/talos/releases/download/${talos_version}/talosctl-linux-amd64"
          sudo mv /tmp/talosctl /usr/local/bin/talosctl
          sudo chmod +x /usr/local/bin/talosctl

      - name: Install talhelper
        run: |
          curl -fsSL https://github.com/budimanjojo/talhelper/releases/download/v3.1.13/talhelper_linux_amd64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/talhelper /usr/local/bin/talhelper
          sudo chmod +x /usr/local/bin/talhelper

      - name: Install yq
        run: |
          curl -fsSL -o /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          sudo mv /tmp/yq /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Run Talos Validation
        run: bash scripts/ci/talos-validate.sh
