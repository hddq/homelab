name: CI - Python

on:
  workflow_call:

jobs:
  ruff:
    name: 🐍 Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.3"

      - name: Run Ruff Formatter Check
        run: ruff format --check .
