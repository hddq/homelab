name: Promote to Stable

on:
  workflow_run:
    workflows:
      - "CI - Ansible"
      - "CI - gitleaks"
      - "CI - Kubernetes"
      - "CI - Global Lint"
      - "CI - Nix"
      - "CI - ShellCheck"
    types:
      - completed
    branches:
      - master

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Promote if all checks passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "Checking workflows for commit $SHA"

          RUNS=$(gh api /repos/${{ github.repository }}/actions/runs?head_sha=$SHA)

          # Check if any are still in progress
          IN_PROGRESS=$(echo "$RUNS" | jq '[.workflow_runs[] | select(.status != "completed")] | length')

          if [ "$IN_PROGRESS" -gt 0 ]; then
            echo "Workflows are still running. Exiting and will be triggered again by the next completion."
            exit 0
          fi

          # Check if any failed
          FAILURES=$(echo "$RUNS" | jq '[.workflow_runs[] | select(.conclusion != "success" and .conclusion != "skipped" and .name != "Promote to Stable")] | length')

          if [ "$FAILURES" -gt 0 ]; then
            echo "Some workflows failed. Not promoting."
            exit 0
          fi

          echo "All workflows passed! Promoting to stable..."

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Setup authentication
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git

          git checkout $SHA
          git push origin HEAD:refs/heads/stable --force
