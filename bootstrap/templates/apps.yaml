{{- if ne .Values.environment "staging" -}}
{{- $targetRevision := .Values.targetRevision -}}
{{- $repoURL := "ssh://git@ssh.github.com:443/hddq/homelab.git" -}}
{{- $server := "https://kubernetes.default.svc" -}}
{{- range $app := list
    (dict "name" "nginx-playground" "path" "apps/nginx-playground" "namespace" "playground")
    (dict "name" "postgres-playground" "path" "apps/postgres-playground" "namespace" "playground")
    (dict "name" "searxng" "path" "apps/searxng" "namespace" "searxng")
    (dict "name" "unbound" "path" "apps/unbound" "namespace" "unbound")
    (dict "name" "opodsync" "path" "apps/opodsync" "namespace" "opodsync")
    (dict "name" "navidrome" "path" "apps/navidrome" "namespace" "navidrome")
    (dict "name" "feishin" "path" "apps/feishin" "namespace" "feishin")
    (dict "name" "restic-rest-server" "path" "apps/restic-rest-server" "namespace" "restic")
    (dict "name" "lidarr" "path" "apps/lidarr" "namespace" "lidarr")
}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-{{ $app.name }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ $repoURL }}
    targetRevision: {{ $targetRevision }}
    path: {{ $app.path }}
  destination:
    server: {{ $server }}
    namespace: {{ $app.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
{{- end -}}
