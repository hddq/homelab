{{- $targetRevision := .Values.targetRevision -}}
{{- $environment := .Values.environment | default "production" -}}
{{- $repoURL := "git@github.com:hddq/homelab.git" -}}
{{- $server := "https://kubernetes.default.svc" -}}
{{- range $app := list
    (dict "name" "cert-manager" "path" "infrastructure/cert-manager" "namespace" "cert-manager" "syncWave" "-2" "syncOptions" (list "CreateNamespace=true" "RespectIgnoreDifferences=true") "ignoreDifferences" (list
      (dict "group" "admissionregistration.k8s.io" "kind" "MutatingWebhookConfiguration" "name" "infrastructure-cert-manager-webhook" "jqPathExpressions" (list ".webhooks[]?.clientConfig.caBundle"))
      (dict "group" "admissionregistration.k8s.io" "kind" "ValidatingWebhookConfiguration" "name" "infrastructure-cert-manager-webhook" "jqPathExpressions" (list ".webhooks[]?.clientConfig.caBundle"))
      (dict "group" "apiextensions.k8s.io" "kind" "CustomResourceDefinition" "jqPathExpressions" (list ".spec.conversion.webhook.clientConfig.caBundle"))
    ))
    (dict "name" "cert-manager-webhook" "path" "infrastructure/cert-manager-webhook" "namespace" "cert-manager" "syncWave" "-1" "syncOptions" (list "CreateNamespace=true" "SkipDryRunOnMissingResource=true" "RespectIgnoreDifferences=true") "ignoreDifferences" (list
      (dict "group" "apiregistration.k8s.io" "kind" "APIService" "name" "v1alpha1.cert-manager.webhook.duckdns.org" "jqPathExpressions" (list ".spec.caBundle"))
    ))
    (dict "name" "cert-manager-issuers" "path" "infrastructure/cert-manager-issuers" "namespace" "cert-manager" "syncWave" "0" "syncOptions" (list "CreateNamespace=true" "SkipDryRunOnMissingResource=true"))
    (dict "name" "metallb" "path" "infrastructure/metallb" "namespace" "metallb-system" "syncOptions" (list "CreateNamespace=true") "helmValueFiles" (list "values.yaml" (printf "values-%s.yaml" $environment)))
    (dict "name" "longhorn" "path" "infrastructure/longhorn" "namespace" "longhorn-system" "syncOptions" (list "CreateNamespace=true") "helmValueFiles" (list "values.yaml" (printf "values-%s.yaml" $environment)))
    (dict "name" "argocd" "path" "infrastructure/argocd" "namespace" "argocd" "syncOptions" (list "ServerSideApply=true") "helmValueFiles" (list "values.yaml" (printf "values-%s.yaml" $environment)))
    (dict "name" "metrics-server" "path" "infrastructure/metrics-server" "namespace" "kube-system")
    (dict "name" "sealed-secrets" "path" "infrastructure/sealed-secrets" "namespace" "kube-system" "syncOptions" (list "CreateNamespace=true"))
    (dict "name" "traefik" "path" "infrastructure/traefik" "namespace" "traefik" "syncOptions" (list "CreateNamespace=true") "helmValueFiles" (list "values.yaml" (printf "values-%s.yaml" $environment)))
    (dict "name" "monitoring" "path" "infrastructure/monitoring" "namespace" "monitoring" "syncOptions" (list "CreateNamespace=true") "helmValueFiles" (list "values.yaml" "values-alertmanager.yaml" "values-grafana.yaml" "values-kube-state-metrics.yaml" "values-node-exporter.yaml" "values-vm-agent.yaml" "values-vm-single.yaml" "values-vmalert.yaml" (printf "values-%s.yaml" $environment)))
}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-{{ $app.name }}
  namespace: argocd
  {{- with $app.syncWave }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ . | quote }}
  {{- end }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ $repoURL }}
    targetRevision: {{ $targetRevision }}
    path: {{ $app.path }}
    {{- with $app.helmValueFiles }}
    helm:
      valueFiles:
        {{- range . }}
        - {{ . }}
        {{- end }}
    {{- end }}
  destination:
    server: {{ $server }}
    namespace: {{ $app.namespace }}
  {{- with $app.ignoreDifferences }}
  ignoreDifferences:
    {{- range . }}
    - group: {{ .group }}
      kind: {{ .kind }}
      {{- with .name }}
      name: {{ . }}
      {{- end }}
      {{- with .jqPathExpressions }}
      jqPathExpressions:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    {{- with $app.syncOptions }}
    syncOptions:
      {{- range . }}
      - {{ . }}
      {{- end }}
    {{- end }}
{{- end }}
