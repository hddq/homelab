apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-nginx-playground
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:hddq/homelab.git
    targetRevision: HEAD
    path: apps/nginx-playground
  destination:
    server: https://kubernetes.default.svc
    namespace: playground
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
