---
- name: 🏗️ Provision New VM on Proxmox
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../secrets.yaml"
    - "../vars/proxmox_infra.yaml"
    - "../vars/k3s_cluster.yaml"

  tasks:
    - name: 🐑 Stage 1 - Linked Clone to Shared Storage
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        validate_certs: false
        node: "{{ template_node }}"
        clone: yes
        vmid: "{{ template_id }}"
        newid: "{{ item.vmid }}"
        name: "{{ item.name }}"
        target: "{{ item.node | default(proxmox_node) }}"
        full: no
        timeout: 500
        state: present
      loop: "{{ vms_to_provision }}"

    - name: 🚚 Stage 1.1 - Move Disk to Local Storage
      community.proxmox.proxmox_disk:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        validate_certs: false
        vmid: "{{ item.vmid }}"
        disk: scsi0
        target_storage: "{{ item.storage | default(default_vm_storage) }}"
        delete_moved: true
        state: moved
      loop: "{{ vms_to_provision }}"

    - name: 🚚 Stage 1.2 - Move EFI Disk to Local Storage
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ item.node | default(proxmox_node) }}/qemu/{{ item.vmid }}/move_disk"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        body_format: form-urlencoded
        body:
          disk: efidisk0
          storage: "{{ item.storage | default(default_vm_storage) }}"
          delete: 1
        validate_certs: false
        status_code: [200]
      loop: "{{ vms_to_provision }}"
      register: move_efi_results

    - name: ⏳ Stage 1.3 - Wait for EFI Disk Move
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ item.item.node | default(proxmox_node) }}/tasks/{{ item.json.data }}/status"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        validate_certs: false
      loop: "{{ move_efi_results.results }}"
      register: efi_task_status
      until: efi_task_status.json.data.status == 'stopped'
      retries: 30
      delay: 2

    - name: 💉 Stage 2 - Inject Cloud-Init Config
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        validate_certs: false
        node: "{{ item.node | default(proxmox_node) }}"
        vmid: "{{ item.vmid }}"
        state: present
        update: yes
        ciuser: "{{ vm_user }}"
        sshkeys: "{{ my_ssh_key }}"
        update_unsafe: true
        net:
          net0: "virtio,bridge=vmbr0,tag={{ item.vlan | default(default_vm_vlan) }}"
        ipconfig:
          ipconfig0: "ip={{ item.ip }}/24,gw={{ item.gateway | default(default_vm_gateway) }}"
        nameservers: "{{ item.dns | default(default_vm_dns) }}"
        memory: "{{ item.ram | default(default_vm_ram) }}"
        balloon: "{{ item.balloon | default(default_vm_balloon) }}"
        shares: "{{ item.shares | default(default_vm_balloon_shares) }}"
        cores: "{{ item.cores | default(default_vm_cores) }}"
      loop: "{{ vms_to_provision }}"

    - name: 💿 Stage 3 - Resize Disk
      community.proxmox.proxmox_disk:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        validate_certs: false
        vmid: "{{ item.vmid }}"
        disk: "scsi0"
        size: "{{ item.disk | default(default_vm_disk) }}"
        state: resized
      loop: "{{ vms_to_provision }}"

    - name: 🛡️ Stage 4 - Configure Disk Options

      community.proxmox.proxmox_disk:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        validate_certs: false
        vmid: "{{ item.vmid }}"
        disk: "scsi0"
        # We disable Proxmox-level backups for worker nodes because they primarily hold
        # ephemeral OS data and Longhorn replicas. Persistent data is already backed
        # up via Longhorn native backups to TrueNAS NFS.
        backup: false
        iothread: "on"
        discard: true
        ssd: true
        state: present
      loop: "{{ vms_to_provision }}"
      when: item.k3s_role == "worker"

    - name: 🚀 Stage 5 - Power On
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        validate_certs: false
        node: "{{ item.node | default(proxmox_node) }}"
        vmid: "{{ item.vmid }}"
        state: started
      loop: "{{ vms_to_provision }}"

    - name: ⏳ Stage 6 - Wait for SSH
      ansible.builtin.wait_for:
        host: "{{ item.ip }}"
        port: 22
        delay: 5
        timeout: 300
        search_regex: OpenSSH
      connection: local
      loop: "{{ vms_to_provision }}"

    - name: 📝 Stage 7 - Add to Inventory File
      ansible.builtin.lineinfile:
        path: "{{ target_inventory_file }}"
        insertafter: '\[k3s_new_nodes\]'
        line: "{{ item.ip }} ansible_user={{ vm_user }}"
        state: present
      check_mode: no
      loop: "{{ vms_to_provision }}"
