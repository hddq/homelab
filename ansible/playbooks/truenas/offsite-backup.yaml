---
- name: 💾 Deploy TrueNAS Offsite Backup
  hosts: truenas
  gather_facts: false
  vars_files:
    - "../../../ansible/secrets.yaml"
  vars:
    script_src: "../../../scripts/truenas/backup/offsite-backup.sh"
    script_dest: "/root/scripts/offsite-backup.sh"
    server_src: "../../../scripts/truenas/backup/offsite-backup-server.py"
    server_dest: "/root/scripts/offsite-backup-server.py"

  tasks:
    - name: 📁 Ensure scripts directory exists on TrueNAS
      ansible.builtin.file:
        path: "/root/scripts"
        state: directory
        mode: "0755"
      become: true

    - name: 📜 Copy backup script to TrueNAS
      ansible.builtin.copy:
        src: "{{ script_src }}"
        dest: "{{ script_dest }}"
        mode: "0700"
      become: true

    - name: 📜 Copy backup server script to TrueNAS
      ansible.builtin.copy:
        src: "{{ server_src }}"
        dest: "{{ server_dest }}"
        mode: "0700"
      become: true

    - name: 🔍 Check if cronjob already exists via midclt
      ansible.builtin.command:
        cmd: midclt call cronjob.query '[["description", "=", "Restic Offsite Backup"]]'
      register: cronjob_check
      changed_when: false
      become: true

    - name: 🧾 Parse cronjob query results
      ansible.builtin.set_fact:
        cronjob_existing: "{{ cronjob_check.stdout | from_json }}"

    - name: ⏰ Setup daily Cronjob in TrueNAS UI via midclt
      ansible.builtin.command:
        cmd: >
          midclt call cronjob.create '{
            "user": "root",
            "command": "{{ server_dest }}",
            "description": "Restic Offsite Backup",
            "enabled": true,
            "stdout": false,
            "stderr": false,
            "schedule": {
              "minute": "0",
              "hour": "0",
              "dom": "*",
              "month": "*",
              "dow": "*"
            }
          }'
      become: true
      changed_when: true
      when: cronjob_existing | length == 0

    - name: ⏰ Update existing Cronjob command
      ansible.builtin.command:
        cmd: >
          midclt call cronjob.update {{ cronjob_existing[0].id }} '{
            "command": "{{ server_dest }}"
          }'
      become: true
      changed_when: true
      when:
        - cronjob_existing | length > 0
        - cronjob_existing[0].command != server_dest
