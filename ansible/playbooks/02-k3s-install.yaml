---
- name: 🛠️ Prepare Nodes & Group Dynamically
  hosts: k3s_new_nodes
  become: true
  gather_facts: true
  vars_files:
    - ../vars/k3s_cluster.yaml
  tasks:
    - name: 🏷️ Group hosts by K3s role dynamically
      ansible.builtin.group_by:
        key: "k3s_{{ item.k3s_role }}"
      loop: "{{ vms_to_provision }}"
      when: item.ip == inventory_hostname

    - name: 📦 Install System Dependencies
      ansible.builtin.apt:
        name: [open-iscsi, nfs-common, qemu-guest-agent]
        state: present
        update_cache: yes

    - name: 🔌 Enable and Start Services
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop: [iscsid, qemu-guest-agent]

- name: 👑 Initialize K3s First Master
  hosts: k3s_master[0]
  become: true
  vars_files:
    - ../vars/k3s_cluster.yaml
  tasks:
    - name: 🧠 Determine if HA (etcd) is needed
      ansible.builtin.set_fact:
        is_ha_cluster: "{{ groups['k3s_master'] | length > 1 }}"

    - name: 🧠 Determine Node Taint (Control Plane Isolation)
      ansible.builtin.set_fact:
        taint_args: >-
          {% if not hostvars[inventory_hostname].get('run_workloads', true) %}
          --node-taint node-role.kubernetes.io/control-plane=true:NoSchedule
          {% else %}
          {% endif %}

    - name: 🔍 Check current K3s version
      ansible.builtin.command: k3s --version
      register: current_k3s_version
      failed_when: false
      changed_when: false

    - name: 📥 Install K3s Server (Init)
      ansible.builtin.shell: >
        set -o pipefail &&
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - server
        {{ '--cluster-init' if is_ha_cluster else '' }}
        {{ taint_args }}
      args:
        executable: /bin/bash
      when: current_k3s_version.rc != 0 or k3s_version not in current_k3s_version.stdout
      changed_when: true

    - name: ⏳ Wait for Node Token
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token

    - name: 🔑 Set Fact for Token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: token_data

    - name: 💾 Store Token globally
      ansible.builtin.set_fact:
        k3s_token: "{{ token_data['content'] | b64decode | trim }}"

- name: 🤝 Join Additional Masters (If HA)
  hosts: k3s_master[1:]
  become: true
  vars_files:
    - ../vars/k3s_cluster.yaml
  vars:
    master_ip: "{{ hostvars[groups['k3s_master'][0]]['inventory_hostname'] }}"
    k3s_token: "{{ hostvars[groups['k3s_master'][0]]['k3s_token'] }}"
  tasks:
    - name: 🔍 Check current K3s version
      ansible.builtin.command: k3s --version
      register: current_k3s_version
      failed_when: false
      changed_when: false

    - name: 📥 Install K3s Server (Join HA)
      ansible.builtin.shell: 'set -o pipefail && curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" K3S_URL=https://{{ master_ip }}:6443 K3S_TOKEN={{ k3s_token }} sh -s - server'
      args:
        executable: /bin/bash
      when: current_k3s_version.rc != 0 or k3s_version not in current_k3s_version.stdout
      changed_when: true

- name: 👷 Join Worker Nodes
  hosts: k3s_worker
  become: true
  vars_files:
    - ../vars/k3s_cluster.yaml
  vars:
    master_ip: "{{ hostvars[groups['k3s_master'][0]]['inventory_hostname'] }}"
    k3s_token: "{{ hostvars[groups['k3s_master'][0]]['k3s_token'] }}"
  tasks:
    - name: 🔍 Check current K3s version
      ansible.builtin.command: k3s --version
      register: current_k3s_version
      failed_when: false
      changed_when: false

    - name: 📥 Install K3s Agent (Worker)
      ansible.builtin.shell: 'set -o pipefail && curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" K3S_URL=https://{{ master_ip }}:6443 K3S_TOKEN={{ k3s_token }} sh -s - agent'
      args:
        executable: /bin/bash
      when: current_k3s_version.rc != 0 or k3s_version not in current_k3s_version.stdout
      changed_when: true

- name: ⚙️ Configure Local Access
  hosts: localhost
  gather_facts: false
  tasks:
    - name: 📥 Fetch Kubeconfig from First Master
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ../../kubeconfig
        flat: yes
      delegate_to: "{{ groups['k3s_master'][0] }}"
      become: true

    - name: 📝 Update Kubeconfig Server Address
      ansible.builtin.replace:
        path: ../../kubeconfig
        regexp: "127.0.0.1"
        replace: "{{ hostvars[groups['k3s_master'][0]]['inventory_hostname'] }}"

    - name: Instructions
      ansible.builtin.debug:
        msg: "Cluster provisioned successfully! Config saved to 'kubeconfig'."
