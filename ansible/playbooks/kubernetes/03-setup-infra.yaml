---
- name: 🚀 Bootstrap Cluster (SOPS + ArgoCD)
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../vars/k3s_cluster.yaml"
  vars:
    env_seed_host: "{{ groups['proxmox'][0] }}"
    env_git_branch: "{{ git_branch | default(hostvars[env_seed_host]['git_branch'] | default('HEAD')) }}"
    env_deployment_environment: "{{ hostvars[env_seed_host]['deployment_environment'] | default('production') }}"
    kubeconfig_path: "{{ playbook_dir }}/../../../{{ hostvars[env_seed_host]['kubeconfig_path'] }}"
    age_sops_key_path: "{{ playbook_dir }}/../../../homelab.key"
    argocd_chart_path: "../../../infrastructure/argocd"

  tasks:
    - name: 📁 Ensure argocd namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        name: argocd
        api_version: v1
        kind: Namespace
        state: present

    - name: 🔑 Check if SOPS age key exists
      ansible.builtin.stat:
        path: "{{ age_sops_key_path }}"
      register: age_sops_key_file

    - name: 🔑 Require SOPS age key
      ansible.builtin.fail:
        msg: "SOPS age key not found at {{ age_sops_key_path }}"
      when: not age_sops_key_file.stat.exists

    - name: 🔑 Apply SOPS age key
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: sops-age
            namespace: argocd
          type: Opaque
          stringData:
            keys.txt: "{{ lookup('ansible.builtin.file', age_sops_key_path) }}"
        state: present
      no_log: true

    - name: 📦 Build Helm Dependencies for Infrastructure
      ansible.builtin.command: helm dependency build
      args:
        chdir: "{{ item }}"
      loop:
        - "{{ argocd_chart_path }}"
      changed_when: false

    - name: ⚓ Install ArgoCD
      kubernetes.core.helm:
        name: infrastructure-argocd
        chart_ref: "{{ argocd_chart_path }}"
        release_namespace: argocd
        create_namespace: true
        kubeconfig: "{{ kubeconfig_path }}"
        wait: true
        wait_timeout: 10m

    - name: ⏳ Pause for Secret Creation
      ansible.builtin.pause:
        seconds: 10

    - name: 🔑 Get ArgoCD Initial Admin Password
      ansible.builtin.shell: |
        set -o pipefail
        kubectl --kubeconfig {{ kubeconfig_path }} -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
      register: argocd_pass
      changed_when: false

    - name: 🌱 Apply Bootstrap Root Application
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition: "{{ lookup('template', 'templates/bootstrap-root.yaml.j2', template_vars={'git_branch': env_git_branch, 'deployment_environment': env_deployment_environment}) | from_yaml }}"
        state: present

    - name: Show ArgoCD Credentials
      ansible.builtin.debug:
        msg:
          - "Cluster bootstrapped successfully!"
          - "ArgoCD User: admin"
          - "ArgoCD Password: {{ argocd_pass.stdout }}"
          - "Access via Port Forward: kubectl --kubeconfig {{ kubeconfig_path }} -n argocd port-forward service/infrastructure-argocd-server 8080:80"
          - "Then open: http://localhost:8080"
