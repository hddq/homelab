---
- name: 🚀 Bootstrap Cluster (Sealed Secrets + ArgoCD)
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../vars/k3s_cluster.yaml"
  vars:
    env_seed_host: "{{ groups['proxmox'][0] }}"
    env_git_branch: "{{ hostvars[env_seed_host]['git_branch'] | default('HEAD') }}"
    kubeconfig_path: "{{ playbook_dir }}/../../../{{ hostvars[env_seed_host]['kubeconfig_path'] }}"
    master_key_path: "../../../sealed-secrets-master-key.yaml"
    argocd_chart_path: "../../../infrastructure/argocd"
    sealed_secrets_chart_path: "../../../infrastructure/sealed-secrets"

  tasks:
    - name: 📁 Ensure kube-system namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        name: kube-system
        api_version: v1
        kind: Namespace
        state: present

    - name: 🔑 Check if Sealed Secrets master key exists
      ansible.builtin.stat:
        path: "{{ master_key_path }}"
      register: master_key_file

    - name: 🔑 Apply the old master key secret
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        src: "{{ master_key_path }}"
        state: present
      when: master_key_file.stat.exists

    - name: 📦 Update Helm Dependencies for Infrastructure
      ansible.builtin.command: helm dependency update
      args:
        chdir: "{{ item }}"
      loop:
        - "{{ sealed_secrets_chart_path }}"
        - "{{ argocd_chart_path }}"
      changed_when: false

    - name: 🔐 Install Sealed Secrets Controller
      kubernetes.core.helm:
        name: sealed-secrets
        chart_ref: "{{ sealed_secrets_chart_path }}"
        release_namespace: kube-system
        kubeconfig: "{{ kubeconfig_path }}"
        wait: true
        wait_timeout: 10m

    - name: ⚓ Install ArgoCD
      kubernetes.core.helm:
        name: infrastructure-argocd
        chart_ref: "{{ argocd_chart_path }}"
        release_namespace: argocd
        create_namespace: true
        kubeconfig: "{{ kubeconfig_path }}"
        wait: true
        wait_timeout: 10m

    - name: ⏳ Pause for Secret Creation
      ansible.builtin.pause:
        seconds: 10

    - name: 🔑 Get ArgoCD Initial Admin Password
      ansible.builtin.shell: |
        set -o pipefail
        kubectl --kubeconfig {{ kubeconfig_path }} -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
      register: argocd_pass
      changed_when: false

    - name: 🌱 Apply Bootstrap Root Application
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        definition: "{{ lookup('template', 'templates/bootstrap-root.yaml.j2', template_vars={'git_branch': env_git_branch}) | from_yaml }}"
        state: present

    - name: Show ArgoCD Credentials
      ansible.builtin.debug:
        msg:
          - "Cluster bootstrapped successfully!"
          - "ArgoCD User: admin"
          - "ArgoCD Password: {{ argocd_pass.stdout }}"
          - "Access via Port Forward: kubectl --kubeconfig {{ kubeconfig_path }} -n argocd port-forward service/infrastructure-argocd-server 8080:80"
          - "Then open: http://localhost:8080"
