---
- name: 🔐 Restore Sealed Secrets Master Key
  hosts: localhost
  gather_facts: false
  vars:
    kubeconfig_path: "../../kubeconfig"
    master_key_path: "../../sealed-secrets-master-key.yaml"

  tasks:
    - name: 📁 Ensure kube-system namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        name: kube-system
        api_version: v1
        kind: Namespace
        state: present

    - name: 🔑 Apply the old master key secret
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        src: "{{ master_key_path }}"
        state: present

    - name: 🔄 Restart controller to pick up the key (if already running)
      command: kubectl --kubeconfig {{ kubeconfig_path }} -n kube-system rollout restart deployment/sealed-secrets-controller
      ignore_errors: yes
      changed_when: false