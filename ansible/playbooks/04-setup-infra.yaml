---
- name: 🚀 Setup Infrastructure (ArgoCD)
  hosts: localhost
  gather_facts: false
  vars:
    kubeconfig_path: "../../kubeconfig"
    argocd_chart_path: "../../infrastructure/argocd"

  tasks:
    - name: 📦 Update Helm Dependencies for ArgoCD
      ansible.builtin.command: helm dependency update
      args:
        chdir: "{{ argocd_chart_path }}"
      changed_when: false

    - name: ⚓ Install ArgoCD
      kubernetes.core.helm:
        name: argocd
        chart_ref: "{{ argocd_chart_path }}"
        release_namespace: argocd
        create_namespace: true
        kubeconfig: "{{ kubeconfig_path }}"
        wait: true
        wait_timeout: 10m

    - name: ⏳ Pause for Secret Creation
      ansible.builtin.pause:
        seconds: 10

    - name: 🔑 Get ArgoCD Initial Admin Password
      ansible.builtin.shell: |
        set -o pipefail
        kubectl --kubeconfig {{ kubeconfig_path }} -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
      register: argocd_pass
      changed_when: false

    - name: 🌱 Apply Bootstrap Application
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        src: "../../bootstrap.yaml"
        state: present

    - name: Show ArgoCD Credentials
      ansible.builtin.debug:
        msg:
          - "ArgoCD installed successfully!"
          - "User: admin"
          - "Password: {{ argocd_pass.stdout }}"
          - "Access via Port Forward: kubectl --kubeconfig {{ kubeconfig_path }} -n argocd port-forward service/argocd-server 8080:80"
          - "Then open: http://localhost:8080"
