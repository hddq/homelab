# yaml-language-server: $schema=https://raw.githubusercontent.com/0xERR0R/blocky/main/docs/config.schema.json
upstreams:
  groups:
    default:
      - 192.168.41.11
      - 192.168.70.2:5353
bootstrapDns:
  - 1.1.1.1
  - 9.9.9.9
ports:
  dns: 53
  http: 4000
caching:
  minTime: 0m
  maxTime: 1h
  maxItemsCount: 50000
  cacheTimeNegative: 2m
  prefetching: true
  prefetchExpires: 2h
  prefetchThreshold: 5
customDNS:
  mapping:
    hddq.duckdns.org: 192.168.40.25
clientLookup:
  clients:
    macan:
      - 192.168.10.19
      - 192.168.70.19
blocking:
  blackLists:
    ads:
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/ultimate.txt
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif.txt
    macan:
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/ultimate.txt
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif.txt
  whiteLists:
    macan:
      - |
        # Facebook
        b-graph-fallback.facebook.com
        b-graph.facebook.com
        graph-fallback.facebook.com
        graph.facebook.com
        graph.fbpigeon.com
        graph.m-freeway.com
        z-m-graph.facebook.com
        web.facebook.com
        z-m-gateway.facebook.com
  clientGroupsBlock:
    default:
      - ads
    macan:
      - macan
statistics:
  enable: true
prometheus:
  enable: true
  path: /metrics
