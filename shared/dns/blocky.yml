# yaml-language-server: $schema=https://raw.githubusercontent.com/0xERR0R/blocky/main/docs/config.schema.json
upstreams:
  groups:
    default:
      - 192.168.41.11
      - 192.168.70.2:5353
ports:
  dns: 53
  http: 4000
caching:
  minTime: 0m
  maxTime: 1h
  maxItemsCount: 50000
  cacheTimeNegative: 2m
  prefetching: true
  prefetchExpires: 2h
  prefetchThreshold: 5
customDNS:
  mapping:
    hddq.duckdns.org: 192.168.40.25
blocking:
  blackLists:
    ads:
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/ultimate.txt
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif.txt
  clientGroupsBlock:
    default:
      - ads
