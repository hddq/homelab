server:
    # === SYSTEM & SECURITY ===
    chroot: ""
    use-syslog: no

    # === LOGGING & DEBUGGING ===
    # If no logfile is specified, syslog is used
    # logfile: "/usr/local/unbound/log.d/unbound.log"
    verbosity: 0

    # === SERVER BINDING & NETWORK ACCESS ===
    interface: 0.0.0.0
    interface: ::0
    port: 5353
    access-control: 0.0.0.0/0 allow
    
    # Protocols
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    do-ip6: yes
    prefer-ip6: no

    # === PERFORMANCE & CACHING ===
    num-threads: 2
    
    # System & Buffers
    # Ensure kernel buffer is large enough to not lose messages in traffic spikes
    so-rcvbuf: 0
    so-sndbuf: 0
    edns-buffer-size: 1232
    
    # Cache Sizes
    msg-cache-size: 128m
    rrset-cache-size: 256m
    #cache-max-ttl: 86400
    cache-min-ttl: 60

    # Optimization Features
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-ttl-reset: yes
    serve-expired-reply-ttl: 30
    minimal-responses: yes

    # === PRIVACY & SECURITY ===
    qname-minimisation: yes
    hide-identity: yes
    hide-version: yes
    
    # DNSSEC & Hardening
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: yes
    aggressive-nsec: yes
    use-caps-for-id: no

    # DNS Rebinding Protection (Local Network Isolation)
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10

    # Private domains exempt from rebinding protection
    # These are real public domains that intentionally resolve to private IPs
    private-domain: "lab.hddq.org"
    private-domain: "stg.hddq.org"

    # === UPSTREAM & RESOLVING ===
    # root-hints: "/var/lib/unbound/root.hints"